services:
    app:
        build:
            context: ./backend
            dockerfile: Dockerfile
        image: signme-backend
        container_name: signme-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - storage_data:/var/www/storage
        environment:
            APP_NAME: ${APP_NAME:-signme}
            APP_ENV: ${APP_ENV:-production}
            APP_KEY: ${APP_KEY:?APP_KEY is required}
            APP_DEBUG: ${APP_DEBUG:-true}
            APP_URL: ${APP_URL:-https://api.signmehere.cloud}
            FRONTEND_URL: ${FRONTEND_URL:-https://signmehere.cloud}
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
            DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
            DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
            MAIL_MAILER: ${MAIL_MAILER:-smtp}
            MAIL_SCHEME: ${MAIL_SCHEME:-smtps}
            MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
            MAIL_PORT: ${MAIL_PORT:-465}
            MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
            MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS is required}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SignMeHere}
            CACHE_STORE: redis
            REDIS_HOST: redis
            SESSION_DRIVER: database
            SESSION_DOMAIN: .signmehere.cloud
            SANCTUM_STATEFUL_DOMAINS: signmehere.cloud,api.signmehere.cloud
            LOG_CHANNEL: stderr

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                NEXT_PUBLIC_BACKEND_URL: "https://api.signmehere.cloud/"
        image: signme-frontend
        container_name: signme-frontend
        restart: unless-stopped

    db:
        image: mysql:8.0
        container_name: signme-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql

    redis:
        image: redis:alpine
        container_name: signme-redis
        restart: unless-stopped
    reverb:
        image: signme-backend
        container_name: signme-reverb
        restart: unless-stopped
        command: "php artisan reverb:start --host=0.0.0.0 --port=8080"
        depends_on:
            - app
            - db
            - redis

volumes:
    mysql_data:
    storage_data:
